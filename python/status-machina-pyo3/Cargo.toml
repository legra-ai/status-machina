[package]
name = "status-machina-pyo3"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
status-machina = { path = "../..", version = "0.1.0" }
status-machina-bridge = { path = "../../bindings/core", version = "0.1.0" }
pyo3 = { version = "0.28.3", features = ["abi3-py310"] }
serde = "1"
serde_json = "1"

[lints.rust]
warnings = "deny"
