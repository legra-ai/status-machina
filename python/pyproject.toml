[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "status-machina"
version = "0.1.16"
description = "Native typed, caller-driven state machines with checked composition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typing-extensions>=4.12"]
license = "MIT OR Apache-2.0"
license-files = ["licenses/LICENSE-MIT", "licenses/LICENSE-APACHE"]
authors = [{ name = "Jacobus Geluk", email = "jacobus.geluk@dataroad.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/legra-ai/status-machina"

[tool.maturin]
manifest-path = "status-machina-pyo3/Cargo.toml"
python-source = "."
module-name = "status_machina._native"
features = ["pyo3/extension-module"]
# Never package interpreter caches from a developer tree.
exclude = ["status_machina/**/__pycache__/**"]

[dependency-groups]
dev = ["maturin>=1.16,<2", "ruff>=0.9", "mypy>=1.15", "uv>=0.6.7"]

[tool.ruff]
# The locked ruff's default rule set, checked in CI. Imports wrap at the Rust
# crates' rustfmt width, one name per line like rustfmt's vertical layout.
line-length = 100
target-version = "py310"

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses with validated defaults: safe as shared argument defaults.
extend-immutable-calls = [
    "status_machina.BehaviorRegistry",
    "status_machina.InspectionLimits",
    "status_machina.Limits",
    "status_machina.ScenarioLimits",
    "status_machina.inspection.InspectionLimits",
    "status_machina.model.BehaviorRegistry",
    "status_machina.model.Limits",
    "status_machina.scenario.ScenarioLimits",
]

[tool.mypy]
files = ["status_machina", "tests/typing"]
warn_unused_ignores = true
