[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "status-machina"
version = "0.1.0"
description = "Native typed, caller-driven state machines with checked composition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typing-extensions>=4.12"]
license = "MIT OR Apache-2.0"
authors = [{ name = "Jacobus Geluk", email = "jacobus.geluk@dataroad.com" }]

[project.urls]
Repository = "https://github.com/legra-ai/status-machina"

[tool.maturin]
manifest-path = "status-machina-pyo3/Cargo.toml"
python-source = "."
module-name = "status_machina._native"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = ["maturin>=1.7,<2", "ruff>=0.9", "mypy>=1.15"]
