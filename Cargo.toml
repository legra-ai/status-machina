[package]
name = "status-machina"
version = "0.1.19"
edition = "2024"
rust-version = "1.99.1"
authors = ["Jacobus Geluk <jacobus.geluk@dataroad.com>"]
description = "Typed caller-driven state machines with checked composition and bounded inspection"
license = "MIT OR Apache-2.0"
repository = "https://github.com/legra-ai/status-machina"
documentation = "https://docs.rs/status-machina"
readme = "README.md"
build = "build.rs"
include = ["/Cargo.toml", "/README.md", "/build.rs", "/LICENSE-APACHE", "/LICENSE-MIT", "src/**/*.rs", "tests/**", "examples/**/*.rs", "docs/**/*.md", "docs/**/*.svg"]

[dependencies]
thiserror = "2"
uuid = { version = "1", features = ["v7"] }

[lints.rust]
warnings = "deny"
missing_docs = "deny"
unreachable_pub = "deny"

[lints.rustdoc]
missing_crate_level_docs = "deny"
broken_intra_doc_links = "deny"

[lints.clippy]
result_large_err = "allow"

# Release preparation bumps this package and then runs the hook, so the version
# commit carries one version for the crate, its binding crates, the Python
# distribution and the npm package (scripts/sync_binding_versions.py).
[package.metadata.version-info]
pre_bump_hooks = ["python3 scripts/sync_binding_versions.py {{version}}"]
additional_files = [
    "bindings/core/Cargo.toml",
    "python/status-machina-pyo3/Cargo.toml",
    "npm/status-machina-napi/Cargo.toml",
    "python/pyproject.toml",
    "python/uv.lock",
    "npm/package.json",
]

[build-dependencies]
rhusky = "2.0.5"

[workspace]
resolver = "3"
members = ["bindings/core", "python/status-machina-pyo3", "npm/status-machina-napi"]
default-members = ["."]
